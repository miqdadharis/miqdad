<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haris Store</title>
    <style type="text/css">
        .header {
            min-height: 50px;
            text-align: center;
        }
        .content {
            background-color: #ddd;
            min-height: 500px;
        }
        .footer {
            background-color: #ccc;
            min-height: 50px;
        }
        .container {
            width: 800px;
            margin: 0 auto;
        }
        .logo img {
            width: 200px;
        }
        .menu ul {
            padding: 0;
        }
        .menu ul li {
            padding: 10px 20px;
            text-decoration: none;
        }
        .thumbnail {
            background-color: white;
            text-align: center;
            padding: 10px;
            width: 225px;
            margin: 10px;
            float: left;
        }
        .thumbnail img {
            width: 100%;
        }
        
        

        
    </style>
</head>
<body>
    <div class="container">
    <div class="header">
    <div class="logo">
        <img src="http://www.datwebdigital.com/DWD/wp-content/uploads/2012/06/logo-design.jpg">
    </div>
    <div class="menu">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
    </div>

    <div class="content">
        <h2>My Products</h2>

        <div class="thumbnail">
            <img src="https://img.freepik.com/premium-vector/instagram-app-icon-social-media-logo-vector-illustration_277909-403.jpg?w=2000">
            <h2>product 2</h2>
            <p>RP 250.000</p>
        </div>
    </div>
    
    <div class="footer">
        <p>copyright 2018 My page</p>
    </div>
</body>
</html>
